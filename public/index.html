<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command N Conquer - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: #161b22;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #30363d;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #58a6ff;
    }

    .status {
      display: inline-block;
      padding: 4px 12px;
      background: #238636;
      color: white;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status.connected { background: #238636; }
    .status.disconnected { background: #da3633; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #161b22;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #30363d;
    }

    .card h3 {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card .value {
      font-size: 32px;
      font-weight: 700;
      color: #58a6ff;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #30363d;
    }

    .tab {
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #c9d1d9;
    }

    .tab.active {
      color: #58a6ff;
      border-bottom-color: #58a6ff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .search-bar {
      margin-bottom: 20px;
    }

    .search-bar input {
      width: 100%;
      padding: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 14px;
    }

    .search-bar input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background: #21262d;
      padding: 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px;
      border-top: 1px solid #30363d;
      font-size: 14px;
    }

    tr:hover {
      background: #21262d;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge.success {
      background: #238636;
      color: white;
    }

    .badge.error {
      background: #da3633;
      color: white;
    }

    .code {
      font-family: 'Monaco', 'Menlo', monospace;
      background: #0d1117;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      color: #79c0ff;
    }

    .log-entry {
      padding: 12px;
      margin-bottom: 8px;
      background: #0d1117;
      border-radius: 6px;
      border-left: 3px solid #30363d;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
    }

    .log-entry.info { border-left-color: #58a6ff; }
    .log-entry.warn { border-left-color: #f0883e; }
    .log-entry.error { border-left-color: #da3633; }
    .log-entry.debug { border-left-color: #8b949e; }

    .log-time {
      color: #8b949e;
      margin-right: 12px;
    }

    .log-level {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 12px;
      font-weight: 600;
      font-size: 10px;
    }

    .log-level.info { background: #1f6feb; }
    .log-level.warn { background: #9e6a03; }
    .log-level.error { background: #d1242f; }
    .log-level.debug { background: #6e7681; }

    .log-msg {
      color: #c9d1d9;
    }

    .btn {
      padding: 8px 16px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #2ea043;
    }

    .btn.danger {
      background: #da3633;
    }

    .btn.danger:hover {
      background: #f85149;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8b949e;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: flex-end;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .live-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #238636;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Command N Conquer</h1>
      <p>Enhanced command execution with logging and history</p>
      <div style="margin-top: 10px;">
        <span class="status" id="connection-status">
          <span class="live-indicator"></span>
          <span id="status-text">Connecting...</span>
        </span>
      </div>
    </header>

    <div class="grid" id="stats-grid">
      <div class="card">
        <h3>Total Commands</h3>
        <div class="value" id="stat-total">-</div>
      </div>
      <div class="card">
        <h3>Failed Commands</h3>
        <div class="value" id="stat-failures">-</div>
      </div>
      <div class="card">
        <h3>Success Rate</h3>
        <div class="value" id="stat-success-rate">-</div>
      </div>
      <div class="card">
        <h3>Avg Duration</h3>
        <div class="value" id="stat-avg-duration">-</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('history')">Command History</button>
      <button class="tab" onclick="switchTab('logs')">Logs</button>
    </div>

    <div id="history-tab" class="tab-content active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search commands, stdout, stderr..." onkeyup="handleSearch()">
      </div>
      <div class="actions">
        <button class="btn" onclick="refreshHistory()">Refresh</button>
        <button class="btn danger" onclick="clearHistory()">Clear History</button>
      </div>
      <div id="history-content"></div>
    </div>

    <div id="logs-tab" class="tab-content">
      <div class="actions">
        <button class="btn" onclick="refreshLogs()">Refresh</button>
      </div>
      <div id="logs-content"></div>
    </div>
  </div>

  <script>
    let eventSource = null;
    let currentTab = 'history';

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      connectSSE();
      loadStats();
      loadHistory();
    });

    // Connect to Server-Sent Events
    function connectSSE() {
      eventSource = new EventSource('/api/events');

      eventSource.onopen = () => {
        updateConnectionStatus(true);
      };

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log('SSE Event:', data);

        if (data.type === 'command_executed') {
          loadStats();
          if (currentTab === 'history') {
            loadHistory();
          }
        }
      };

      eventSource.onerror = () => {
        updateConnectionStatus(false);
        setTimeout(connectSSE, 5000);
      };
    }

    function updateConnectionStatus(connected) {
      const status = document.getElementById('connection-status');
      const text = document.getElementById('status-text');
      if (connected) {
        status.className = 'status connected';
        text.textContent = 'Live';
      } else {
        status.className = 'status disconnected';
        text.textContent = 'Disconnected';
      }
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const json = await res.json();
        if (json.success) {
          const stats = json.data;
          document.getElementById('stat-total').textContent = stats.total || 0;
          document.getElementById('stat-failures').textContent = stats.failures || 0;
          const successRate = stats.total > 0
            ? ((stats.total - stats.failures) / stats.total * 100).toFixed(1) + '%'
            : '-';
          document.getElementById('stat-success-rate').textContent = successRate;
          document.getElementById('stat-avg-duration').textContent = stats.avgDuration + 'ms';
        }
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/history?limit=100');
        const json = await res.json();
        if (json.success) {
          renderHistory(json.data);
        }
      } catch (error) {
        console.error('Failed to load history:', error);
      }
    }

    function renderHistory(commands) {
      const container = document.getElementById('history-content');
      if (commands.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3>No commands yet</h3>
            <p>Command history will appear here once you start executing commands</p>
          </div>
        `;
        return;
      }

      const html = `
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Command</th>
              <th>Exit Code</th>
              <th>Duration</th>
              <th>CWD</th>
            </tr>
          </thead>
          <tbody>
            ${commands.map(cmd => `
              <tr>
                <td>${new Date(cmd.timestamp).toLocaleString()}</td>
                <td><span class="code">${escapeHtml(cmd.command)}</span></td>
                <td>
                  <span class="badge ${cmd.exitCode === 0 ? 'success' : 'error'}">
                    ${cmd.exitCode}
                  </span>
                </td>
                <td>${cmd.duration}ms</td>
                <td><span style="color: #8b949e; font-size: 12px;">${escapeHtml(cmd.cwd)}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      container.innerHTML = html;
    }

    async function loadLogs() {
      try {
        const res = await fetch('/api/logs?limit=100');
        const json = await res.json();
        if (json.success) {
          renderLogs(json.data);
        }
      } catch (error) {
        console.error('Failed to load logs:', error);
      }
    }

    function renderLogs(logs) {
      const container = document.getElementById('logs-content');
      if (logs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No logs yet</h3>
            <p>Execution logs will appear here</p>
          </div>
        `;
        return;
      }

      const html = logs.map(log => {
        const level = getLevelName(log.level);
        const time = new Date(log.time).toLocaleTimeString();
        return `
          <div class="log-entry ${level}">
            <span class="log-time">${time}</span>
            <span class="log-level ${level}">${level.toUpperCase()}</span>
            <span class="log-msg">${escapeHtml(log.msg)}</span>
          </div>
        `;
      }).join('');
      container.innerHTML = html;
    }

    function getLevelName(level) {
      const levels = { 10: 'debug', 20: 'debug', 30: 'info', 40: 'warn', 50: 'error', 60: 'error' };
      return levels[level] || 'info';
    }

    async function handleSearch() {
      const query = document.getElementById('search-input').value;
      if (!query) {
        loadHistory();
        return;
      }

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=50`);
        const json = await res.json();
        if (json.success) {
          renderHistory(json.data);
        }
      } catch (error) {
        console.error('Search failed:', error);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

      if (tab === 'history') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('history-tab').classList.add('active');
        loadHistory();
      } else if (tab === 'logs') {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('logs-tab').classList.add('active');
        loadLogs();
      }
    }

    function refreshHistory() {
      loadHistory();
      loadStats();
    }

    function refreshLogs() {
      loadLogs();
    }

    async function clearHistory() {
      if (!confirm('Are you sure you want to clear command history?')) {
        return;
      }

      try {
        const res = await fetch('/api/history', { method: 'DELETE' });
        const json = await res.json();
        alert(json.message || 'History cleared');
        loadHistory();
        loadStats();
      } catch (error) {
        console.error('Failed to clear history:', error);
        alert('Failed to clear history');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
